<div class="connexion-page">

  <div class="connexion-container">

    <img
      src="/logo.png"
      alt="Logo PrivateClub"
      class="logo"
    >

    <h1>PrivateClub</h1>

    <h2>Connexion</h2>


    <form (ngSubmit)="seConnecter()">

      <!-- EMAIL -->

      <label for="email">
        Email professionnel
      </label>

      <input
        type="email"
        id="email"
        name="email"
        [(ngModel)]="email"
        placeholder="Entrez votre email"
      >


      <!-- MOT DE PASSE -->

      <label for="motdepasse">
        Mot de passe
      </label>

      <input
        type="password"
        id="motdepasse"
        name="motdepasse"
        [(ngModel)]="motDePasse"
        placeholder="Entrez votre mot de passe"
      >


      <!-- BOUTON -->

      <button type="submit">
        Se connecter
      </button>

    </form>


    <!-- MESSAGE -->

    <p class="message">
      {{ message }}
    </p>

  </div>

</div>
